<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0a1b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PropertyApp" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>PropertyApp — Nova</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/vendor/chart.umd.js"></script>
  </head>
  <body>
    <div class="shell">
      <nav class="rail" id="rail">
        <div class="rail-logo">
          <div class="rail-logo-mark">
            <svg viewBox="0 0 24 24">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
          </div>
          <span class="rail-logo-text">PropertyApp</span>
        </div>
        <div class="rail-nav" id="nav">
          <div class="rail-section">Główne</div>
          <div class="nav-item" data-view="dashboard">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
            <span class="nav-label">Dashboard</span>
          </div>
          <div class="nav-item" data-view="nieruchomosci">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
            <span class="nav-label">Nieruchomości</span>
          </div>
          <div class="nav-item" data-view="najemcy">
            <svg viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <span class="nav-label">Najemcy</span>
            <span class="nav-badge nb-v" id="badge-tenants">—</span>
          </div>
          <div class="rail-section">Finanse</div>
          <div class="nav-item" data-view="umowy">
            <svg viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
            </svg>
            <span class="nav-label">Umowy</span>
          </div>
          <div class="nav-item" data-view="platnosci">
            <svg viewBox="0 0 24 24">
              <rect x="1" y="4" width="22" height="16" rx="2" />
              <line x1="1" y1="10" x2="23" y2="10" />
            </svg>
            <span class="nav-label">Płatności</span>
            <span class="nav-badge nb-a" id="badge-payments">—</span>
          </div>
          <div class="nav-item" data-view="raporty">
            <svg viewBox="0 0 24 24">
              <line x1="18" y1="20" x2="18" y2="10" />
              <line x1="12" y1="20" x2="12" y2="4" />
              <line x1="6" y1="20" x2="6" y2="14" />
            </svg>
            <span class="nav-label">Raporty</span>
          </div>
          <div class="nav-item" data-view="koszty">
            <svg viewBox="0 0 24 24">
              <line x1="12" y1="1" x2="12" y2="23" />
              <path d="M17 5H9.5a3.5 3.5 0 1 0 0 7h5a3.5 3.5 0 1 1 0 7H6" />
            </svg>
            <span class="nav-label">Koszty</span>
          </div>
          <div class="rail-section">Inne</div>
          <div class="nav-item" data-view="zadania">
            <svg viewBox="0 0 24 24">
              <polyline points="9 11 12 14 22 4" />
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
            </svg>
            <span class="nav-label">Zadania</span>
            <span class="nav-badge nb-r" id="badge-tasks">—</span>
          </div>
          <div class="nav-item" data-view="dokumenty">
            <svg viewBox="0 0 24 24">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            <span class="nav-label">Dokumenty</span>
          </div>
          <div class="nav-item" data-view="ustawienia">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14" />
            </svg>
            <span class="nav-label">Ustawienia</span>
          </div>
        </div>
        <div class="rail-footer">
          <div class="rail-avatar">PM</div>
          <div>
            <div class="rail-user-name">Property Manager</div>
            <div class="rail-user-role">Administrator</div>
          </div>
        </div>
      </nav>

      <div class="workspace">
        <div class="topbar" id="topbar">
          <div class="topbar-left">
            <span class="topbar-view-label" id="topbar-title">Dashboard</span>
            <span class="topbar-sep">·</span>
            <span class="topbar-sub" id="topbar-sub">—</span>
          </div>
          <div class="topbar-search">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" placeholder="Szukaj albo wpisz komendę AI…" id="global-search" />
            <button
              type="button"
              class="topbar-voice"
              id="voice-command"
              aria-label="Dyktuj komendę AI"
              aria-pressed="false"
              title="Dyktuj komendę AI"
            >
              <svg viewBox="0 0 24 24">
                <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z" />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <line x1="12" y1="19" x2="12" y2="22" />
                <line x1="8" y1="22" x2="16" y2="22" />
              </svg>
            </button>
            <span class="topbar-kbd">⌘K</span>
          </div>
          <div class="topbar-right" id="topbar-actions"></div>
        </div>
        <div class="content" id="view-root"></div>
      </div>
    </div>

    <div id="modal-root"></div>
    <div class="toast-wrap" id="toast-root"></div>
    <script src="/app.js"></script>
  </body>
</html>
